query RecentClosedPullRequests(
  $query: String!
  $cursor: String
  $pageSize: Int!
  $viewer: String!
  $timelineEachEnd: Int!
  $viewerReviewCount: Int!
) {
  search(query: $query, type: ISSUE, first: $pageSize, after: $cursor) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ... on PullRequest {
        number
        title
        url
        author { login }
        authorAssociation
        createdAt
        updatedAt
        closedAt
        mergedAt
        timelineFirst: timelineItems(
          first: $timelineEachEnd
          itemTypes: [ISSUE_COMMENT, PULL_REQUEST_REVIEW]
        ) {
          ...TimelineConnectionFields
        }
        timelineLast: timelineItems(
          last: $timelineEachEnd
          itemTypes: [ISSUE_COMMENT, PULL_REQUEST_REVIEW]
        ) {
          ...TimelineConnectionFields
        }
        viewerReviews: reviews(last: $viewerReviewCount, author: $viewer) {
          totalCount
          nodes {
            id
            author { login }
            authorAssociation
            body
            createdAt
            submittedAt
            updatedAt
            url
            state
            commit { oid }
          }
        }
      }
    }
  }
  rateLimit {
    cost
    limit
    remaining
    resetAt
  }
}

fragment TimelineConnectionFields on PullRequestTimelineItemsConnection {
  totalCount
  nodes {
    __typename
    ... on IssueComment {
      id
      author { login }
      authorAssociation
      body
      createdAt
      updatedAt
      url
    }
    ... on PullRequestReview {
      id
      author { login }
      authorAssociation
      body
      createdAt
      submittedAt
      updatedAt
      url
      state
      commit { oid }
    }
  }
}
