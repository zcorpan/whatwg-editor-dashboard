query RecentClosedPullRequests(
  $query: String!
  $cursor: String
  $pageSize: Int!
  $timelineEachEnd: Int!
  $reviewCount: Int!
) {
  search(query: $query, type: ISSUE, first: $pageSize, after: $cursor) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ... on PullRequest {
        ...ClosedPullRequestFields
      }
    }
  }
  rateLimit {
    cost
    limit
    remaining
    resetAt
  }
}

# Shared with closed_pull_requests_by_id.graphql, which the incremental build uses to
# refetch a PR that closed since the last build. github.py appends HistoryFields from
# history_pull_requests.graphql, so a recent merge is also a history record.
fragment ClosedPullRequestFields on PullRequest {
  ...HistoryFields
  id
  number
  title
  url
  author { login }
  authorAssociation
  createdAt
  updatedAt
  closedAt
  mergedAt
  isDraft
  # The latest switch from draft to ready for review. A PR's age counts from
  # here, or from creation if it was never a draft. See models.py.
  readyForReview: timelineItems(last: 1, itemTypes: [READY_FOR_REVIEW_EVENT]) {
    nodes {
      ... on ReadyForReviewEvent {
        actor { login }
        createdAt
      }
    }
  }
  timelineFirst: timelineItems(
    first: $timelineEachEnd
    itemTypes: [ISSUE_COMMENT, PULL_REQUEST_REVIEW]
  ) {
    ...TimelineConnectionFields
  }
  timelineLast: timelineItems(
    last: $timelineEachEnd
    itemTypes: [ISSUE_COMMENT, PULL_REQUEST_REVIEW]
  ) {
    ...TimelineConnectionFields
  }
  reviews(last: $reviewCount) {
    totalCount
    nodes {
      id
      author { login }
      authorAssociation
      createdAt
      submittedAt
      updatedAt
      state
      commit { oid }
    }
  }
}

fragment TimelineConnectionFields on PullRequestTimelineItemsConnection {
  # totalCount counts every timeline item kind, not just the itemTypes requested
  # below, so completeness is derived from pageInfo instead. See models.py.
  totalCount
  pageInfo {
    hasNextPage
  }
  nodes {
    __typename
    ... on IssueComment {
      id
      author { login }
      authorAssociation
      createdAt
      updatedAt
    }
    ... on PullRequestReview {
      id
      author { login }
      authorAssociation
      createdAt
      submittedAt
      updatedAt
      state
      commit { oid }
    }
  }
}
