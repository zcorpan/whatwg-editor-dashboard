repository:
  owner: whatwg
  name: html

# Current HTML editors. These are public identities: they are the queue perspectives,
# the rows of the editor-impact section, and the population of the response-time
# metrics. Which one is *you* is chosen in the browser, not here.
#
# Each entry is a login, or a mapping with `login`, a `share` of routed work (default
# 1; 0 never routes anything) and a `status`. A `retired` editor keeps a queue
# perspective and still counts as an editor response, but only direct requests reach
# them.
editors:
  - annevk
  - login: domenic
    status: retired
  - domfarolino
  - foolip
  - zcorpan

# Non-editors who review regularly enough to take routed review work. They get their
# own queue perspective but are not editors for any metric.
helpers:
  - login: noamr
    share: 1

response_targets:
  initial_editor_response_days: 7
  highlight_new_hours: 48
  # Health target: the share of contributor PRs that get a first editor response
  # inside initial_editor_response_days.
  first_response_within_target_percent: 80

attention:
  # How recently a PR must have changed to count as "active now", and how long a
  # public mention keeps claiming attention. Review requests and assignments are
  # current GitHub state and never expire.
  activity_window_days: 30

ready_bounded:
  max_changed_files: 8
  max_changed_lines: 800
  minimum_checklist_ratio: 1.0

blocking_labels:
  - do not merge yet
  - needs implementer interest
  - needs tests
  - needs work
  - blocked

sampling:
  # The outer page is deliberately small because each PR includes several nested samples.
  # On a GitHub 502/504 timeout, the client halves this automatically for the rest of the build.
  graphql_page_size: 10
  timeline_each_end: 25
  reviews_per_pr: 25
  review_threads: 50
  history_days: 90

suggested_next:
  # Contributor PRs that have never had an editor reply and are still inside
  # response_targets.initial_editor_response_days lead the queue, closest to the
  # deadline first: they are the only ones where a reply can still meet the target.
  # 0 disables the lead; the lane stays browsable either way.
  first_response_lead: 3
  # Then everything in the "active now" lane, newest activity first.
  # Remaining lanes are interleaved so the backlog cannot be starved by new work.
  cycle:
    - land
    - rereview
    - overdue
    - oldest_wait
    - ready_bounded
    - stale_direct
    - stale_author

incremental:
  # With a stored snapshot (`build --state DIR`), a build only fetches PRs updated since
  # the previous one. A full fetch still runs at least this often, because some changes
  # (an edited or deleted comment) never move a PR's updatedAt.
  full_every_days: 7
  # Look this far before the previous build's start, in case GitHub's search index lags.
  overlap_hours: 2

waiting_on:
  # Labels decide whose move a PR is before the conversation does, because a label is
  # an editor's deliberate statement.
  meeting_labels:
    - agenda+
    - agenda+ f2f
  # These hold a PR without saying why. If its description names an open PR it depends
  # on, it waits on that; otherwise the label shows as a warning and the conversation
  # decides.
  hold_labels:
    - do not merge yet
    - blocked
  party_labels:
    needs implementer interest: implementers
    needs compat analysis: compat
    needs tests: tests
    needs concrete proposal: proposal
    needs incubation: proposal
  # Waiting on the author for longer than this: a candidate to ping or close.
  stale_author_days: 180

issues:
  # Issues are queued only if they were opened, or last answered by a contributor,
  # inside this window; most of whatwg/html's open issues are dormant.
  window_days: 90
  # An issue without a label starting with this is in the triage lane.
  topic_label_prefix: "topic:"
