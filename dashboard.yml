# Current HTML editors. These are public identities: they are the queue perspectives,
# the rows of the editor-impact section, and the population of the response-time
# metrics. Which one is *you* is chosen in the browser, not here.
#
# Each entry is a login, or a mapping with `login`, a `share` of routed work (default
# 1; 0 never routes anything), a `status`, and `knows`. A `retired` editor keeps a
# queue perspective and still counts as an editor response, but only direct requests
# reach them.
#
# `knows` is what routing goes by: labels, which cover spec pages through `topics:`
# below (a page no label covers can be named directly, `sections` for sections.html).
# It is declared, not computed, because merged-PR history misses design done
# elsewhere and follows volume.
#
# DRAFT, for each person to prune and extend: seeded with every topic where they hold
# at least 10% of the credit in merged-PR history (`dashboard.py expertise`) or belong
# to the matching @whatwg team. Topics nobody else covered fall back to zcorpan.
