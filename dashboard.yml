response_targets:
  initial_editor_response_days: 7
  highlight_new_hours: 48
  # Health target: the share of contributor PRs that get a first editor response
  # inside initial_editor_response_days.
  first_response_within_target_percent: 80

attention:
  # How recently a PR must have changed to count as "active now", and how long a
  # public mention keeps claiming attention. Review requests and assignments are
  # current GitHub state and never expire.
  activity_window_days: 30

ready_bounded:
  max_changed_files: 8
  max_changed_lines: 800
  minimum_checklist_ratio: 1.0

blocking_labels:
  - do not merge yet
  - needs implementer interest
  - needs tests
  - needs work
  - blocked

sampling:
  # The outer page is deliberately small because each PR includes several nested samples.
  # On a GitHub 502/504 timeout, the client halves this automatically for the rest of the build.
  graphql_page_size: 10
  timeline_each_end: 25
  reviews_per_pr: 25
  review_threads: 50
  history_days: 90

suggested_next:
  # Contributor PRs that have never had an editor reply and are still inside
  # response_targets.initial_editor_response_days lead the queue, closest to the
  # deadline first: they are the only ones where a reply can still meet the target.
  # 0 disables the lead; the lane stays browsable either way.
  first_response_lead: 3
  # Then everything in the "active now" lane, newest activity first.
  # Remaining lanes are interleaved so the backlog cannot be starved by new work.
  cycle:
    - land
    - rereview
    - overdue
    - oldest_wait
    - ready_bounded
    - stale_direct
    - stale_author

incremental:
  # With a stored snapshot (`build --state DIR`), a build only fetches PRs updated since
  # the previous one. A full fetch still runs at least this often, because some changes
  # (an edited or deleted comment) never move a PR's updatedAt.
  full_every_days: 7
  # Look this far before the previous build's start, in case GitHub's search index lags.
  overlap_hours: 2

waiting_on:
  # Labels decide whose move a PR is before the conversation does, because a label is
  # an editor's deliberate statement.
  meeting_labels:
    - agenda+
    - agenda+ f2f
  # These hold a PR without saying why. If its description names an open PR it depends
  # on, it waits on that; otherwise the label shows as a warning and the conversation
  # decides.
  hold_labels:
    - do not merge yet
    - blocked
  party_labels:
    needs implementer interest: implementers
    needs compat analysis: compat
    needs tests: tests
    needs concrete proposal: proposal
    needs incubation: proposal
  # Waiting on the author for longer than this: a candidate to ping or close.
  stale_author_days: 180

issues:
  # Issues are queued only if they were opened, or last answered by a contributor,
  # inside this window; most of whatwg/html's open issues are dormant.
  window_days: 90
  # An issue without a label starting with this is in the triage lane.
  topic_label_prefix: "topic:"

expertise:
  # Merged PRs since this date (about when whatwg/html moved to PRs) are fetched by
  # full builds. They teach the topic-label suggester which labels go with which spec
  # pages, and feed `dashboard.py expertise`, the manual who-knows-what report.
  # Routing does not read them.
  since: "2016-01-01"
  # In that report, a contribution this many days old counts half as much as one today.
  half_life_days: 365

routing:
  # Unanswered PRs and issues are each routed to one person, by the topics they declare
  # (`knows`) and recent load. The prior keeps an item nobody declares spread by load.
  prior: 0.1
  load_window_days: 28
  # Routed-and-answered figures count from here; earlier items had no owner.
  start: "2026-11-23"

# Which multipage spec pages (images for images.html) each label covers. A change to a
# page counts as being about the labels that cover it, so `knows:` lists only labels,
# and an unlabeled change can be suggested its label. Any label listed here is a
# topic label, `topic:` prefix or not, and can be declared in `knows:`. Seeded from
# which labels merged PRs on each page carried, then hand-fixed; `build --evaluate`
# reports the pages no label covers.
topics:
  "topic: canvas": [canvas, imagebitmap-and-animations]
  "topic: cross-origin isolation": [browsers]
  "topic: custom elements": [custom-elements]
  "topic: custom protocols": [system-state]
  "topic: dialog": [interactive-elements]
  "topic: drag and drop": [dnd]
  "topic: document metadata": [semantics]
  "topic: dynamic markup insertion": [dynamic-markup-insertion]
  "topic: embed and object": [iframe-embed-object]
  "topic: eventsource": [server-sent-events]
  "topic: fetch": [urls-and-fetching]
  "topic: focus": [interaction]
  "topic: forms": [forms, form-control-infrastructure, input]
  "topic: frames/navigables/browsing contexts": [document-sequences, iframe-embed-object]
  "topic: grouping content": [grouping-content]
  "topic: img": [images, embedded-content, image-maps]
  "topic: links": [links, "semantics#the-link-element", "text-level-semantics#the-a-element"]
  "topic: mathml": [embedded-content-other]
  "topic: media": [media]
  "topic: messaging": [web-messaging, comms]
  "topic: navigation": [nav-history-apis, browsing-the-web, document-lifecycle]
  "topic: origin": [origin]
  "topic: parser": [parsing, xhtml, named-characters]
  "topic: popover": [popover]
  "topic: reflect": [common-dom-interfaces]
  "topic: resource hints (inc. preload)": [speculative-loading]
  "topic: rendering": [rendering]
  "topic: ruby": ["text-level-semantics#the-ruby-element", "text-level-semantics#the-rt-element", "text-level-semantics#the-rp-element"]
  "topic: sanitizer": [dynamic-markup-insertion]
  "topic: script": [webappapis, scripting]
  "topic: sections": [sections]
  "topic: select": [form-elements]
  "topic: selectors": [semantics-other]
  "topic: serialize and transfer": [structured-data]
  "topic: storage": [webstorage]
  "topic: style": ["semantics#the-style-element", "dom#the-style-attribute"]
  "topic: svg": [embedded-content-other]
  "topic: table": [tables]
  "topic: text-level semantics": [text-level-semantics]
  "topic: timers and user prompts": [timers-and-user-prompts]
  "topic: url": [urls-and-fetching, "semantics#the-base-element"]
  "topic: workers and worklets": [workers, worklets]
  "removal/deprecation": [obsolete]
  # Not a GitHub label: a catch-all for the element and document pages that no
  # per-category label (whatwg/html#13322) covers. A section entry (`page#section`,
  # the spec's anchor for the heading) wins over a whole page.
  "element semantics": [dom, edits, microdata, common-microsyntaxes]
  # Areas of knowledge that are not a spec page: declarable in `knows:`, and a topic of
  # any item that carries them.
  "accessibility": []
  "a11y-tracker": []
  "i18n-tracker": []
  "security/privacy": []
  "document conformance": [syntax]
  "spec tooling": []
  "dev edition": []

# Labels proposed to be renamed or merged, under the name that replaces them. An item
# with an old label counts as the new one, and `knows:` and `teams:` accept either, so
# the new names work before the labels are changed on GitHub. Suggestions only ever
# name a label that exists. The labels new in whatwg/html#13322 (topic: mathml,
# topic: messaging, topic: sections, topic: grouping content, topic: text-level
# semantics, topic: document metadata) need no alias.
topic_aliases:
  "topic: cross-origin isolation": ["topic: cross-origin-opener-policy", "topic: cross-origin-embedder-policy"]
  "topic: links": ["topic: link", "topic: hyperlink"]
  "topic: forms": ["topic: fieldset"]
  "topic: navigation": ["topic: location"]
  "topic: workers and worklets": ["topic: workers", "topic: worklets"]
  "topic: timers and user prompts": ["topic: timing"]
  "topic: dynamic markup insertion": ["topic: document.open()"]

# Spec pages every change touches, which say nothing about its topic.
ignore_pages:
  - acknowledgements
  - indices
  - references
  - infrastructure
  - index
  - introduction
  - iana

# GitHub teams (whatwg/meta GITHUB-TEAMS.md) and the labels whose items they are a good
# audience for. Suggested, never mentioned: the triager decides.
teams:
  html-parser: ["topic: parser"]
  forms: ["topic: forms", "topic: select", "topic: fieldset", "topic: button"]
  media: ["topic: media"]
  canvas: ["topic: canvas"]
  rendering: ["topic: rendering"]
  components: ["topic: custom elements", "topic: shadow"]
  cross-origin-isolation: ["topic: cross-origin-opener-policy", "topic: cross-origin-embedder-policy"]
  modules: ["topic: script", "topic: imports/exports"]
  css: ["topic: style", "topic: selectors"]
  storage: ["topic: storage"]
  a11y: ["accessibility", "a11y-tracker", "a11y-needs-resolution"]
  i18n: ["i18n-tracker", "i18n-needs-resolution"]
  security: ["security/privacy", "security-tracker", "security-needs-resolution"]
  documentation: ["impacts documentation"]

contributors:
  # Anyone who isn't an editor or helper but reviewed at least this many other
  # people's PRs in the twelve-week health window gets their own row, named, with the
  # numbers that qualified them.
  min_reviews_of_others: 10
