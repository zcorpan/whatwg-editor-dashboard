repository:
  owner: whatwg
  name: html

viewer: zcorpan

# Current HTML editors. These are public identities used for response-time metrics.
editors:
  - annevk
  - domenic
  - domfarolino
  - foolip
  - zcorpan

response_targets:
  initial_editor_response_days: 7
  highlight_new_hours: 48
  # Health target: the share of contributor PRs that get a first editor response
  # inside initial_editor_response_days.
  first_response_within_target_percent: 80

attention:
  # How recently a PR must have changed to count as "active now", and how long a
  # public mention keeps claiming attention. Review requests and assignments are
  # current GitHub state and never expire.
  activity_window_days: 30

ready_bounded:
  max_changed_files: 8
  max_changed_lines: 800
  minimum_checklist_ratio: 1.0

blocking_labels:
  - do not merge yet
  - needs implementer interest
  - needs tests
  - needs work
  - blocked

sampling:
  # The outer page is deliberately small because each PR includes several nested samples.
  # On a GitHub 502/504 timeout, the client halves this automatically for the rest of the build.
  graphql_page_size: 10
  timeline_each_end: 25
  viewer_reviews: 25
  review_threads: 50
  history_days: 90

suggested_next:
  # Contributor PRs that have never had an editor reply and are still inside
  # response_targets.initial_editor_response_days lead the queue, closest to the
  # deadline first: they are the only ones where a reply can still meet the target.
  # 0 disables the lead; the lane stays browsable either way.
  first_response_lead: 3
  # Then everything in the "active now" lane, newest activity first.
  # Remaining lanes are interleaved so the backlog cannot be starved by new work.
  cycle:
    - rereview
    - overdue
    - oldest_wait
    - ready_bounded
    - stale_direct
