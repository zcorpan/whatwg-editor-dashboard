name: Build and deploy editor dashboard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Fetch everything, ignoring the snapshot the previous build left
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # An incremental build takes a few minutes and the weekly full one (every PR and
    # issue, the merged-PR history, and a fresh whatwg/html clone when the cache is
    # cold) about 25. The rest is room for the GraphQL client's retry budget
    # (DEFAULT_RETRY_BUDGET_SECONDS in editor_dashboard/github.py) plus the timed-out
    # requests themselves, so a GitHub incident is waited out rather than costing a day.
    timeout-minutes: 120
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      # The previous build's raw GitHub data, so this one only fetches what changed.
      # A cache keeps the workflow read-only; a miss (evicted, or the first run) just
      # means a full fetch. The snapshot is never published (see PRIVACY.md).
      - name: Restore the previous build's snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: dashboard-snapshot-${{ github.run_id }}
          restore-keys: dashboard-snapshot-

      # A bare clone of whatwg/html, for mapping each PR to the spec pages it touches.
      # Cloning costs about 850 MB, so the clone is cached and only fetched into; a new
      # cache entry is saved once a week rather than every day.
      - name: Name this week's spec clone cache
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore the spec repository clone
        id: spec-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spec-repo
          key: whatwg-html-git-${{ steps.week.outputs.week }}
          restore-keys: whatwg-html-git-

      - name: Build dashboard from public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FULL_FETCH: ${{ inputs.full && '--full' || '' }}
        run: python dashboard.py build --output site --state .state --spec-repo .spec-repo $FULL_FETCH

      - name: Save the spec repository clone
        if: steps.spec-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spec-repo
          key: whatwg-html-git-${{ steps.week.outputs.week }}

      # Cache entries are immutable, so every run saves under its own key and the next
      # one restores the newest by prefix.
      - name: Save the snapshot for the next build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: dashboard-snapshot-${{ github.run_id }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
